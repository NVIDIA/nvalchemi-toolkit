# The NVSkills CI sandbox is a Python 3.11 image with public network, no GPU
# and no toolkit. There is no Dockerfile: harbor.pre_agent_setup installs the
# CPU stack (CPU torch, nvalchemi-toolkit 0.3.0, ASE) and the two public
# checkpoints into /workspace before the agent starts. It runs in both arms
# (with the skill and the baseline), so they see the same environment.
# runtime_env puts that venv first on PATH and exports the checkpoint paths.
schema_version: 1

harbor:
  n_attempts: 3
  # 3, not 2: baseline runs on CPU are slow and should not hit the agent
  # timeout.
  timeout_multiplier: 3
  # SkillEvaluator's pass@k compares its own overall (the judge dimensions)
  # with this value. The task goal itself is gated by the custom metrics from
  # evals/grader.py.
  pass_threshold: 0.9
  runtime_env:
    BASH_DEFAULT_TIMEOUT_MS: "240000"
    VIRTUAL_ENV: /workspace/.venv
    PATH: /workspace/.venv/bin:/tmp/agent-home/.local/bin:/home/agent/.local/bin:/usr/local/share/npm-global/bin:/opt/openhands-venv/bin:/usr/local/bin:/usr/bin:/bin
    OMP_NUM_THREADS: "4"
    AIMNET2_CKPT: /workspace/.ckpt/aimnet2_rxn_0.pt
    MACE_CKPT: /workspace/.ckpt/mace-medium-density-agnesi-stress.model
  pre_agent_setup:
    - |
      set -eu
      nva_root="${NVALCHEMI_EVAL_ROOT:-/workspace}"
      nva_env="$nva_root/.venv"
      nva_ckpt="$nva_root/.ckpt"
      nva_publish=false
      nva_host_python=$(command -v python3)
      if [ ! -e "$nva_env" ] && [ ! -L "$nva_env" ]; then
        nva_env=$(mktemp -d "$nva_root/.nvalchemi-env.XXXXXX")
        nva_publish=true
        "$nva_host_python" -m venv --system-site-packages --without-pip "$nva_env"
        printf 'Installing CPU nvalchemi dependencies into %s\n' "$nva_env"
        # The CPU torch wheel comes alone from the PyTorch index, so the
        # resolver never takes the CUDA wheel from PyPI. Everything else
        # resolves on PyPI. antlr4-python3-runtime 4.9.3 (via physicsnemo ->
        # hydra-core) ships only as a pure-Python sdist, so it is the one
        # exemption from wheels-only.
        "$nva_host_python" -m pip --python "$nva_env" install \
          --cert "${PIP_CERT:-/etc/ssl/certs/ca-certificates.crt}" \
          --disable-pip-version-check --no-input --only-binary=:all: --no-compile \
          --progress-bar off --no-deps \
          --index-url https://download-r2.pytorch.org/whl/cpu \
          'torch==2.13.0+cpu'
        "$nva_host_python" -m pip --python "$nva_env" install \
          --cert "${PIP_CERT:-/etc/ssl/certs/ca-certificates.crt}" \
          --disable-pip-version-check --no-input --only-binary=:all: --no-compile \
          --progress-bar off --no-binary=antlr4-python3-runtime \
          'torch==2.13.0+cpu' 'nvalchemi-toolkit==0.3.0' \
          'nvalchemi-toolkit-ops==0.5.0' 'ase==3.27.0'
      fi
      # Public MIT checkpoints, checked by SHA-256 (same as the GPU reference image).
      mkdir -p "$nva_ckpt"
      "$nva_host_python" - "$nva_ckpt" <<'PY'
      import hashlib, os, sys, urllib.request
      root = sys.argv[1]
      files = [
          ("aimnet2_rxn_0.pt",
           "https://storage.googleapis.com/aimnetcentral/aimnet2v2/AIMNet2rxn/aimnet2_rxn_0.pt",
           "ce8bc2a4cc6fcb5ebaa1bc8897fcd75104e5a00fe86e9d5fc6a020d572174894"),
          ("mace-medium-density-agnesi-stress.model",
           "https://github.com/ACEsuit/mace-mp/releases/download/mace_mp_0b2/mace-medium-density-agnesi-stress.model",
           "a90be07c8aa6623c390fcc4653d3e319c4a356f8b4a53d323f96b2012d375caf"),
      ]
      for name, url, sha in files:
          path = os.path.join(root, name)
          if not os.path.exists(path):
              urllib.request.urlretrieve(url, path + ".part")
              os.replace(path + ".part", path)
          with open(path, "rb") as fh:
              digest = hashlib.sha256(fh.read()).hexdigest()
          if digest != sha:
              sys.exit(f"checksum mismatch: {path}")
          os.chmod(path, 0o444)
      PY
      printf 'Checking CPU environment: %s\n' "$nva_env"
      "$nva_env/bin/python" -u - <<'PY'
      import sys
      import torch
      import nvalchemi
      from nvalchemi.data import AtomicData, Batch
      from nvalchemi.models.lj import LennardJonesModelWrapper

      assert nvalchemi.__version__ == "0.3.0", nvalchemi.__version__
      data = AtomicData(
          positions=torch.tensor([[0.0, 0.0, 0.0], [3.8, 0.0, 0.0]]),
          atomic_numbers=torch.tensor([18, 18]),
      )
      # Two atoms, each the other's only neighbor; padding uses n_atoms.
      data.add_node_property("neighbor_matrix", torch.tensor([[1, 2], [0, 2]], dtype=torch.int32))
      data.add_node_property("num_neighbors", torch.tensor([1, 1], dtype=torch.int32))
      batch = Batch.from_data_list([data])
      model = LennardJonesModelWrapper(epsilon=0.0104, sigma=3.40, cutoff=8.5)
      energy = model(batch)["energy"]
      assert energy.shape[0] == 1 and bool(torch.isfinite(energy).all())
      print("nvalchemi environment ready:", sys.executable, sys.version.split()[0],
            "torch", torch.__version__, "cuda", torch.cuda.is_available(),
            "energy", float(energy.sum()))
      PY
      # Publish only after installation and the smoke check; a failed env stays
      # for diagnosis and a retry uses a fresh path.
      if [ "$nva_publish" = true ]; then
        ln -sT "$nva_env" "$nva_root/.venv"
      fi

# evals/grader.py runs the machine checks of each task after the judges and
# adds the metrics batched, device_aware, loop_syncs, reuse, and outcome per
# trial. SkillEvaluator's overall is unchanged by them.
grading:
  mode: default_plus_custom
  # Metric names that evals/grader.py writes under custom_metrics.
  custom_metrics:
    - batched
    - device_aware
    - loop_syncs
    - reuse
    - outcome
