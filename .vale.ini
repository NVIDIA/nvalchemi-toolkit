; Prose linting for docs and the paper (pre-commit `vale` hooks).
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Google, proselint, write-good
Vocab = Toolkit

[*.{md}]
BasedOnStyles = Vale, Google, proselint, write-good
; The Toolkit vocabulary covers project and scientific terminology.
Vale.Spelling = YES
; Use the vocabulary only for spelling exceptions, not casing enforcement.
Vale.Terms = NO
; Academic register, not product docs: passive voice, first-person "we",
; and uncontracted forms are the scientific-writing convention; E-Prime
; bans "to be" outright.
Google.We = NO
Google.Contractions = NO
write-good.E-Prime = NO
Google.Acronyms = NO
Google.WordListCase = NO

[*.{rst}]
BasedOnStyles = Vale, Google, proselint, write-good
; The Toolkit vocabulary covers project and scientific terminology.
Vale.Spelling = YES
; Use the vocabulary only for spelling exceptions, not casing enforcement.
Vale.Terms = NO
; Academic register, not product docs: passive voice, first-person "we",
; and uncontracted forms are the scientific-writing convention; E-Prime
; bans "to be" outright.
Google.We = NO
Google.Contractions = NO
write-good.E-Prime = NO
Google.Acronyms = NO
Google.WordListCase = NO
; Sphinx API roles are code-like tokens, but rst2html exposes their targets as
; prose. Ignore them to avoid spacing alerts on qualified names such as d.D.
TokenIgnores = (:(?:[A-Za-z][A-Za-z0-9_-]*:)?(?:class|func|meth|attr|mod|data|const|exc|obj):`[^`]+`)

[*.{py}]
BasedOnStyles = Vale, write-good
; Keep spelling focused on reader-facing docs; Python prose contains many
; identifier-like tokens that do not benefit from a general dictionary.
Vale.Spelling = NO
Vale.Terms = NO
