; Prose linting for docs and the paper (pre-commit `vale` hooks).
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Google, proselint, write-good

[*.{md}]
BasedOnStyles = Vale, Google, proselint, write-good
; Built-in spelling floods on domain vocabulary (autograd, virial, cuEq,
; …); re-enable once a project Vocab/accept.txt is curated.
Vale.Spelling = NO
; Academic register, not product docs: passive voice, first-person "we",
; and uncontracted forms are the scientific-writing convention; E-Prime
; bans "to be" outright.
Google.We = NO
Google.Contractions = NO
write-good.E-Prime = NO
Google.Acronyms = NO
Google.Colons = NO
Google.ExcessiveClaims = NO
Google.WordListCase = NO
; Error-severity floods across the existing docs: Latin abbreviations
; (e.g., i.e.) are house style; Annotations (TODO/XXX) are tracked work
; items in the design notes; Typography's ©-substitution misreads
; (a)/(b)/(c) enumeration markers.
proselint.Annotations = NO
proselint.Typography = NO

