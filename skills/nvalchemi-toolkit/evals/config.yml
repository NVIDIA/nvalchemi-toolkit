# NVSkills CI builds evals/environment/Dockerfile into the sandbox image. That
# image holds the CPU stack (CPU torch, nvalchemi-toolkit 0.3.0, ASE) in
# /opt/nvalchemi-venv, outside /workspace, which the sandbox replaces with an
# empty volume. The image is for this evaluation only; users install the
# toolkit from PyPI. harbor.pre_agent_setup only checks the stack, in both
# arms (with the skill and the baseline), so they see the same environment.
# runtime_env puts that venv first on PATH.
schema_version: 1

harbor:
  # Keep the Dockerfile's own FROM and build it as written; the toolkit stack
  # does not need the evaluator's shared base image.
  custom_dockerfile_mode: preserve
  base_image_mode: disabled
  # CI runs only the first max_cases tasks of evals.json, in file order, so
  # the order matters. The remaining tasks run in the maintainers' own
  # evaluation.
  max_cases: 6
  n_attempts: 3
  # 3, not 2: baseline runs on CPU are slow and should not hit the agent
  # timeout.
  timeout_multiplier: 3
  # SkillEvaluator's pass@k compares its own overall (the judge dimensions)
  # with this value. The task goal itself is gated by the custom metrics from
  # evals/grader.py.
  pass_threshold: 0.9
  runtime_env:
    BASH_DEFAULT_TIMEOUT_MS: "240000"
    VIRTUAL_ENV: /opt/nvalchemi-venv
    PATH: /opt/nvalchemi-venv/bin:/tmp/agent-home/.local/bin:/home/agent/.local/bin:/usr/local/share/npm-global/bin:/opt/openhands-venv/bin:/usr/local/bin:/usr/bin:/bin
    OMP_NUM_THREADS: "4"
  pre_agent_setup:
    # Checks the baked stack in a few seconds; it installs nothing.
    - |
      /opt/nvalchemi-venv/bin/python -u - <<'PY'
      import sys
      import torch
      import nvalchemi
      from nvalchemi.data import AtomicData, Batch
      from nvalchemi.models.lj import LennardJonesModelWrapper

      assert nvalchemi.__version__ == "0.3.0", nvalchemi.__version__
      data = AtomicData(
          positions=torch.tensor([[0.0, 0.0, 0.0], [3.8, 0.0, 0.0]]),
          atomic_numbers=torch.tensor([18, 18]),
      )
      # Two atoms, each the other's only neighbor; padding uses n_atoms.
      data.add_node_property("neighbor_matrix", torch.tensor([[1, 2], [0, 2]], dtype=torch.int32))
      data.add_node_property("num_neighbors", torch.tensor([1, 1], dtype=torch.int32))
      batch = Batch.from_data_list([data])
      model = LennardJonesModelWrapper(epsilon=0.0104, sigma=3.40, cutoff=8.5)
      energy = model(batch)["energy"]
      assert energy.shape[0] == 1 and bool(torch.isfinite(energy).all())
      print("nvalchemi environment ready:", sys.executable, sys.version.split()[0],
            "torch", torch.__version__, "cuda", torch.cuda.is_available(),
            "energy", float(energy.sum()))
      PY

# evals/grader.py runs the machine checks of each task after the judges and
# adds the metrics batched, device_aware, loop_syncs, reuse, and outcome per
# trial. SkillEvaluator's overall is unchanged by them.
grading:
  mode: default_plus_custom
  # Metric names that evals/grader.py writes under custom_metrics.
  custom_metrics:
    - batched
    - device_aware
    - loop_syncs
    - reuse
    - outcome
